name: Run SecOps Kafka to Snowflake Pipeline

on:
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install prefect confluent-kafka snowflake-connector-python

      - name: Run flow
        run: python flows/secops_pipeline_flow.py